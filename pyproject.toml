[project]
name = "polars-pipeline"
version = "0.1.0"
description = "Standardised, hermetic, stage-able Polars pipelines"
requires-python = ">=3.14"
dependencies = [
    "polars>=1.44.2",
    "polspec>=0.4.1",
]

[project.optional-dependencies]
excel = ["fastexcel>=0.12"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "fastexcel>=0.12",
    "openpyxl>=3.1",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polars_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
